[project]
name = "prodoscore-automation-library"
version = "0.1.0"
description = "Prodoscore automation library with Playwright, Pytest and POM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.57.0",
    "pytest>=8.0.0",
    "pytest-playwright>=0.7.2",
    "pytest-xdist>=3.5.0",
    "allure-pytest>=2.13.0",
    "pytest-html>=4.1.0",
    "mysql-connector-python>=8.3.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automation_lib"]
